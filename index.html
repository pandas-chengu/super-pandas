<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pixel Paws · 像素电子宠物陪伴系统</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pixel Paws" />
  <meta name="theme-color" content="#FDF8F0" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <div class="app">
    <header class="pixel-card header">
      <div class="brand">
        <div class="brand-icon" id="header-paw-icon"></div>
        <div>
          <div class="brand-title">
            <h1>Pixel Paws</h1>
            <span id="t-subtitle-badge" class="badge bg-green">像素陪伴</span>
          </div>
          <p id="t-iphone-tip" class="tip">iPhone Safari 点分享 → 添加到主屏幕即可安装</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="pixel-card-sm coins"><span id="coin-icon-slot"></span><span id="ui-coins">120</span></div>
        <button id="btn-lang" class="pixel-btn bg-blue">中文 / EN</button>
        <button id="btn-shop" class="pixel-btn bg-pink">🛍️ 商店</button>
        <button id="btn-save-panel" class="pixel-btn bg-tan">💾 存档</button>
      </div>
    </header>

    <div id="save-panel" class="pixel-card panel hidden">
      <div class="panel-head">
        <span id="t-save-title">💾 存档备份与恢复（推荐定期导出到备忘录）</span>
        <button id="btn-save-close" class="x-btn" aria-label="Close">✕</button>
      </div>
      <div class="panel-row">
        <button id="btn-export-save" class="pixel-btn bg-green">📤 导出存档码</button>
        <button id="btn-import-save" class="pixel-btn bg-blue">📥 导入存档码</button>
      </div>
      <textarea id="save-code-box" rows="2" class="save-box"></textarea>
    </div>

    <div id="shop-panel" class="pixel-card panel hidden">
      <div class="panel-head">
        <span id="t-shop-title">🛍️ 商店</span>
        <button id="btn-shop-close" class="x-btn" aria-label="Close">✕</button>
      </div>
      <div id="t-shop-hats" class="shop-label">🎩 帽子</div>
      <div id="shop-hats" class="shop-grid"></div>
      <div id="t-shop-decor" class="shop-label">🏡 房间装饰</div>
      <div id="shop-decor" class="shop-grid"></div>
    </div>

    <section class="pixel-card picker">
      <div class="tabs" id="species-tabs"></div>
      <div class="gender">
        <span id="t-gender-label" class="muted-label">性别：</span>
        <button id="btn-gender-female" class="pixel-btn bg-pink">♀ 女生</button>
        <button id="btn-gender-male" class="pixel-btn bg-blue">♂ 男生</button>
      </div>
    </section>

    <main class="main">
      <section class="col-scene">
        <div class="pixel-card scene-card">
          <div class="scene-head">
            <span id="ui-room-badge" class="chip bg-green"></span>
            <span id="ui-fav-hint" class="chip bg-yellow fav-hint"></span>
          </div>
          <div class="scene">
            <canvas id="scene-canvas"></canvas>
            <div id="speech-bubble" class="bubble hidden"></div>
            <div id="game-hud" class="hud hidden">
              <span class="hud-chip">⏱ <span id="hud-time">30</span></span>
              <span class="hud-chip">⭐ <span id="hud-score">0</span></span>
              <button id="btn-quit" class="hud-chip hud-quit" aria-label="Quit">✕</button>
            </div>
          </div>
        </div>

        <div class="pixel-card controls">
          <div class="actions">
            <button id="btn-pat" class="pixel-btn bg-pink">✋ 摸摸</button>
            <button id="btn-play" class="pixel-btn bg-green">🧶 玩耍</button>
            <button id="btn-sleep" class="pixel-btn bg-blue">💤 休息</button>
          </div>
          <div id="snacks-grid" class="snacks"></div>
        </div>
      </section>

      <section class="pixel-card col-status">
        <div class="status-head">
          <div class="name-row">
            <input id="pet-name-input" maxlength="12" class="name-input" />
            <span id="ui-gender-tag" class="tag"></span>
          </div>
          <div class="font-pixel-en level">Lv.<span id="ui-level">1</span></div>
        </div>

        <div id="ui-mood" class="mood"></div>

        <div class="bars">
          <div>
            <div class="bar-label"><span id="lbl-exp">✨ 经验</span><span id="val-exp">0/100</span></div>
            <div class="stat-bar-bg"><div id="bar-exp" class="stat-bar-fill" style="background:#F4C95D"></div></div>
          </div>
          <div>
            <div class="bar-label"><span id="lbl-happy">💖 开心</span><span id="val-happy">80</span></div>
            <div class="stat-bar-bg"><div id="bar-happy" class="stat-bar-fill" style="background:#F59BB2"></div></div>
          </div>
          <div>
            <div class="bar-label"><span id="lbl-full">🍙 饱腹</span><span id="val-full">75</span></div>
            <div class="stat-bar-bg"><div id="bar-full" class="stat-bar-fill" style="background:#88D498"></div></div>
          </div>
          <div>
            <div class="bar-label"><span id="lbl-energy">⚡ 精力</span><span id="val-energy">85</span></div>
            <div class="stat-bar-bg"><div id="bar-energy" class="stat-bar-fill" style="background:#7EC8E3"></div></div>
          </div>
          <div>
            <div class="bar-label"><span id="lbl-annoy">💢 怒气</span><span id="val-annoy">0</span></div>
            <div class="stat-bar-bg"><div id="bar-annoy" class="stat-bar-fill" style="background:#E5534B"></div></div>
          </div>
        </div>

        <div class="note-box">
          <div class="note-head">
            <span id="t-daily-title" class="note-title">📅 今日任务</span>
            <button id="btn-gift" class="pixel-btn bg-yellow gift-btn">🎁 领取</button>
          </div>
          <ul id="goal-list" class="goals"></ul>
        </div>

        <div class="note-box">
          <div id="t-room-desc-title" class="note-title">🏡 房间特色</div>
          <p id="ui-room-desc" class="note-text"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="./game.js"></script>
</body>
</html>
